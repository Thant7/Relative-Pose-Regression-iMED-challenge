[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imed-relative-pose"
version = "0.1.0"
description = "RoMa correspondence feature injection for Reloc3r relative pose regression"
requires-python = ">=3.10"
dependencies = ["torch", "torchvision", "numpy", "scipy", "Pillow", "opencv-python", "tqdm", "einops", "huggingface-hub[torch]>=0.22"]

[project.scripts]
imed-pose = "roma_pose.cli:main"

[tool.setuptools.packages.find]
include = ["roma_pose*"]
